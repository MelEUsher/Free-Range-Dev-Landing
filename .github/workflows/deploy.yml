name: CI/CD + Lighthouse Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only prose is exempt from CI. Dependency manifests (package.json,
    # package-lock.json), everything under public/, and image assets must run
    # the build and Lighthouse audit: dependency bumps are the change class most
    # likely to break the build, and static assets are exactly what Lighthouse
    # exists to police.
    paths-ignore:
      - '**/*.md'
      - 'README'
      - 'README.md'

jobs:
  build-and-audit:
    name: Build + Lighthouse CI
    runs-on: ubuntu-latest

    # Least privilege, matching codeql.yml. Nothing in this job writes to the
    # repository or the API: checkout and setup-node both document contents:read
    # as sufficient, upload-artifact and the Actions cache authenticate with the
    # Actions runtime token rather than GITHUB_TOKEN, and Lighthouse uploads to
    # the filesystem and Google temporary public storage, with no LHCI GitHub
    # status token configured.
    permissions:
      contents: read

    # Push-event guard only, and deliberately left as-is. On pull_request events
    # there is no github.event.head_commit, so the first clause tests an empty
    # string and always passes. That is correct here: GitHub already skips
    # push and pull_request runs natively when the head commit message contains
    # [skip ci], and the only rewrite that would make this clause live on PRs
    # (matching the PR title instead) would add a new way to skip CI, which is
    # the opposite of what this workflow needs.
    if: >
      !contains(join(github.event.head_commit.message, ' '), '[skip ci]') &&
      !endsWith(github.ref, '/skip')

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Next.js app
        run: npm run build

      - name: 🌍 Start server in background
        run: |
          PORT=4000 npm run start &
          sleep 8

      - name: Warm Next.js cache
        run: |
          echo "Warming cache…"

          # Warm homepage
          curl -s http://localhost:4000/ > /dev/null

          # Warm CSS bundles
          for css in $(ls .next/static/css/*.css 2>/dev/null); do
            curl -s http://localhost:4000/_next/static/css/$(basename $css) > /dev/null || true
          done

          # Warm JS chunks
          for js in $(ls .next/static/chunks/*.js 2>/dev/null); do
            curl -s http://localhost:4000/_next/static/chunks/$(basename $js) > /dev/null || true
          done

          # Warm LCP image
          curl -s "http://localhost:4000/_next/image?url=/assets/Image%20saved%20for%20website%20use.svg&w=2048&q=75" > /dev/null || true

      - name: 🔍 Run Lighthouse CI (Desktop)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.desktop.json
          temporaryPublicStorage: true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/desktop
